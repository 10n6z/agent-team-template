# frontend agent's own pipeline. Owned by agent/frontend.
name: frontend
on:
  push:
    branches: [agent/frontend]
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.100 --profile minimal -c clippy,rustfmt && rustup default 1.100
      - run: make -C frontend lint test build

